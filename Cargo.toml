[package]
name = "galaxy"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Real-time 3D Barnes-Hut N-body galaxy sandbox rendered with raw OpenGL"
license = "MIT"
publish = false

# The simulation core (src/sim) uses no external crates; these only open a
# window, create the GL context and load GL function pointers.
[dependencies]
glow = "0.18"
glutin = "0.32"
glutin-winit = "0.5"
winit = "0.30"

[profile.release]
lto = "fat"
codegen-units = 1
